# Supabase CLI config. Run `npx supabase init` if the CLI asks for the
# remaining defaults; keep the function settings below.
project_id = "budgetapp"

# Every function checks the caller itself (user session, or the cron secret
# for plaid-sync), so the gateway's JWT check is off.
[functions.plaid-link-token]
verify_jwt = false

[functions.plaid-exchange]
verify_jwt = false

[functions.plaid-sync]
verify_jwt = false

[functions.plaid-disconnect]
verify_jwt = false

[functions.paychecks-detect]
verify_jwt = false
